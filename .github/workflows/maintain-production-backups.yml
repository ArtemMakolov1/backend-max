name: Inspect or rotate production backups

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect the backup inventory or rotate local copies under the deployment lock
        type: choice
        options: [inspect, cleanup, cleanup_logical]
        default: inspect
        required: true

permissions:
  contents: read

concurrency:
  group: maxposty-backend-production-backup-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    if: github.ref == 'refs/heads/main' && github.repository == 'ArtemMakolov1/backend-max'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://maxposty.ru
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      VPS_USER: ${{ vars.VPS_USER || 'maxposty-deploy' }}
      VPS_DEPLOY_DIR: ${{ vars.VPS_DEPLOY_DIR || '/opt/maxposty/backend' }}
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the reviewed backup maintenance
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "Configured production target is required" >&2; exit 1; }
          [[ "$VPS_PORT" =~ ^[1-9][0-9]{0,4}$ ]] || { echo "Invalid production port" >&2; exit 1; }
          (( VPS_PORT <= 65535 )) || { echo "Invalid production port" >&2; exit 1; }
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo "Invalid production user" >&2; exit 1; }
          [[ "$VPS_DEPLOY_DIR" =~ ^(/[A-Za-z0-9_-]+)+$ ]] || { echo "Invalid deployment directory" >&2; exit 1; }
          [[ "$MODE" == inspect || "$MODE" == cleanup || "$MODE" == cleanup_logical ]] || { echo "Invalid backup maintenance mode" >&2; exit 1; }
          [[ -f deploy/backup/rotate-production-backups.py && ! -L deploy/backup/rotate-production-backups.py ]] || { echo "Reviewed backup maintenance is missing" >&2; exit 1; }
          python3 -m unittest discover -s deploy/tests -p 'test_backup_retention.py'
      - name: Configure pinned SSH host identity
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_PRIVATE_KEY" && -n "$VPS_SSH_KNOWN_HOSTS" ]] || { echo "Pinned deployment SSH identity is required" >&2; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" >"$HOME/.ssh/id_deploy"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" >"$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_deploy" "$HOME/.ssh/known_hosts"
      - name: Run reviewed backup maintenance
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_deploy" -p "$VPS_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            "${VPS_USER}@${VPS_HOST}" "python3 - '$VPS_DEPLOY_DIR' '$MODE'" \
            <deploy/backup/rotate-production-backups.py 2>/dev/null || {
              echo "Production backup maintenance did not complete" >&2
              exit 1
            }
      - name: Remove runner SSH credentials
        if: ${{ always() }}
        shell: bash
        run: rm -f "$HOME/.ssh/id_deploy" "$HOME/.ssh/known_hosts"

name: Backend Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vulnerabilities:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
          cache: true
      - name: Install govulncheck v1.6.0
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Scan reachable Go vulnerabilities
        run: |
          "$(go env GOPATH)/bin/govulncheck" ./...

  repository-scan:
    name: Repository secrets and high-risk misconfiguration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Block exposed secrets and high-risk configuration findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, post-2026 incident immutable commit
        with:
          scan-type: fs
          scan-ref: .
          version: v0.72.0
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
          timeout: 10m

  monitoring-images:
    name: Monitoring image scan (${{ matrix.component }}, ${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        component: [postgres-exporter, pgbouncer-exporter, node-exporter, alertmanager, prometheus, grafana]
        platform: [linux/amd64, linux/arm64]
        include:
          - component: postgres-exporter
            image: "ghcr.io/artemmakolov1/maxposty-postgres-exporter:v0.20.1-go1.26.9.1@sha256:34453c8d1b299b6fe480eb782f626f50c5bd986c720a2fae714c28ddcea9ecfc"
            trivyignores: ""
          - component: pgbouncer-exporter
            image: "ghcr.io/artemmakolov1/maxposty-pgbouncer-exporter:v0.12.1-go1.26.9.1@sha256:1c959e07a965732824085554446886f83d0e9c0c323ff0ab210f036b2f1d7c87"
            trivyignores: ""
          - component: node-exporter
            image: "ghcr.io/artemmakolov1/maxposty-node-exporter:v1.12.1-go1.26.9.1@sha256:7dceac589965ee8ed794de9fc1bf4be194331fb6224b6715eaefeb9d6c4da717"
            trivyignores: ""
          - component: alertmanager
            image: "ghcr.io/artemmakolov1/maxposty-alertmanager:v0.34.1-go1.26.9.1@sha256:ffee0dba12bf417a33ca0148f266d53abe2b37700fe4211a7c383d2bd2a6dce5"
            trivyignores: ""
          - component: prometheus
            image: "ghcr.io/artemmakolov1/maxposty-prometheus:v3.15.0-go1.27.2.1@sha256:c66333fad371671d2cc959cb9797c63fb4de410b25b3cf5fb5f83d867d0d8840"
            trivyignores: ""
          - component: grafana
            image: "ghcr.io/artemmakolov1/maxposty-grafana:nightly-20261010-prometheus.1@sha256:fd7d5b6f50be28b578ecfaad8ca5d416c097e8dc10116f1b6476f179c116789a"
            trivyignores: ""
    env:
      TRIVY_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in for private MaxPosty monitoring images
        if: ${{ startsWith(matrix.image, 'ghcr.io/') }}
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Block fixed high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, post-2026 incident immutable commit
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          version: v0.72.0
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: "true"
          trivyignores: ${{ matrix.trivyignores }}
          exit-code: "1"
          format: table
          timeout: 10m
      - name: Remove registry credentials
        if: ${{ always() && startsWith(matrix.image, 'ghcr.io/') }}
        shell: bash
        run: docker logout ghcr.io >/dev/null 2>&1 || true

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
          cache: true
      - name: Verify dependency checksums and module graph
        run: |
          go mod verify
          go list -mod=readonly -m all >/dev/null

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
          cache: true
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: go
          build-mode: manual
          queries: security-extended
      - name: Build for CodeQL
        run: go build ./...
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:go

  release-security-gate:
    name: Release security gate
    if: ${{ always() }}
    needs: [vulnerabilities, repository-scan, monitoring-images, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every release security check
        shell: bash
        env:
          VULNERABILITIES_RESULT: ${{ needs.vulnerabilities.result }}
          REPOSITORY_SCAN_RESULT: ${{ needs.repository-scan.result }}
          MONITORING_IMAGES_RESULT: ${{ needs.monitoring-images.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: |
          set -euo pipefail
          [[ "$VULNERABILITIES_RESULT" == "success" ]]
          [[ "$REPOSITORY_SCAN_RESULT" == "success" ]]
          [[ "$MONITORING_IMAGES_RESULT" == "success" ]]
          [[ "$CODEQL_RESULT" == "success" ]]

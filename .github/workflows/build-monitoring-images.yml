name: Build patched monitoring images

on:
  workflow_dispatch:
    inputs:
      component:
        description: Build every monitoring image or one changed component
        type: choice
        required: true
        default: all
        options:
          - all
          - postgres-exporter
          - pgbouncer-exporter
          - node-exporter
          - alertmanager
          - grafana

permissions:
  contents: read

concurrency:
  group: maxposty-monitoring-images
  cancel-in-progress: false

jobs:
  build:
    name: Build immutable monitoring images
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      postgres_exporter: ${{ steps.build.outputs.postgres_exporter }}
      pgbouncer_exporter: ${{ steps.build.outputs.pgbouncer_exporter }}
      node_exporter: ${{ steps.build.outputs.node_exporter }}
      alertmanager: ${{ steps.build.outputs.alertmanager }}
      grafana: ${{ steps.build.outputs.grafana }}
      components: ${{ steps.build.outputs.components }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and push both architectures with provenance and SBOM
        id: build
        shell: bash
        env:
          REQUESTED_COMPONENT: ${{ inputs.component || 'all' }}
        run: |
          set -euo pipefail
          case "$REQUESTED_COMPONENT" in
            all|postgres-exporter|pgbouncer-exporter|node-exporter|alertmanager|grafana) ;;
            *) echo 'Unsupported monitoring component' >&2; exit 1 ;;
          esac
          components=$(jq -cn --arg component "$REQUESTED_COMPONENT" \
            'if $component == "all" then ["postgres-exporter", "pgbouncer-exporter", "node-exporter", "alertmanager", "grafana"] else [$component] end')
          printf 'components=%s\n' "$components" >>"$GITHUB_OUTPUT"
          owner=${GITHUB_REPOSITORY_OWNER,,}
          docker buildx create --name maxposty-monitoring-builder --driver docker-container --use
          docker buildx inspect --bootstrap

          build_image() {
            local component=$1
            local version=$2
            local dockerfile=$3
            if [[ "$REQUESTED_COMPONENT" != all && "$REQUESTED_COMPONENT" != "$component" ]]; then
              return
            fi
            local repository="ghcr.io/${owner}/maxposty-${component}"
            local metadata="$RUNNER_TEMP/${component}.json"
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --file "$dockerfile" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --tag "${repository}:${version}" \
              --provenance=mode=max \
              --sbom=true \
              --metadata-file "$metadata" \
              --push \
              .
            local digest
            digest=$(jq -er '."containerimage.digest"' "$metadata")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s=%s@%s\n' "${component//-/_}" "$repository" "$digest" >>"$GITHUB_OUTPUT"
          }

          build_image postgres-exporter v0.20.1-go1.26.8.3 docker/monitoring/postgres-exporter.Dockerfile
          build_image pgbouncer-exporter v0.12.1-go1.26.8.3 docker/monitoring/pgbouncer-exporter.Dockerfile
          build_image node-exporter v1.12.1-go1.26.8.1 docker/monitoring/node-exporter.Dockerfile
          build_image alertmanager v0.34.1-go1.26.8.2 docker/monitoring/alertmanager.Dockerfile
          build_image grafana nightly-20261004-prometheus.2 docker/monitoring/grafana.Dockerfile
      - name: Remove registry credentials
        if: ${{ always() }}
        shell: bash
        run: docker logout ghcr.io >/dev/null 2>&1 || true

  scan:
    name: Scan ${{ matrix.component }} (${{ matrix.platform }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.build.outputs.components) }}
        platform: [linux/amd64, linux/arm64]
    env:
      TRIVY_PLATFORM: ${{ matrix.platform }}
      IMAGE_REF: >-
        ${{ matrix.component == 'postgres-exporter' &&
            needs.build.outputs.postgres_exporter ||
            matrix.component == 'pgbouncer-exporter' &&
            needs.build.outputs.pgbouncer_exporter ||
            matrix.component == 'node-exporter' &&
            needs.build.outputs.node_exporter ||
            matrix.component == 'alertmanager' &&
            needs.build.outputs.alertmanager ||
            needs.build.outputs.grafana }}
    steps:
      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Block fixed high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REF }}
          version: v0.72.0
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: "true"
          exit-code: "1"
          format: table
          timeout: 10m
      - name: Remove registry credentials
        if: ${{ always() }}
        shell: bash
        run: docker logout ghcr.io >/dev/null 2>&1 || true
